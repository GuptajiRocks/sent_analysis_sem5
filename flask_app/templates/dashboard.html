{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-semibold mb-4 text-gray-700">Welcome, {{ username }}!</h2>

<form method="POST">
  <textarea name="text_input" class="w-full p-3 border rounded-lg" rows="3" placeholder="Enter text to analyze..." required></textarea>
  <button class="mt-3 w-full bg-purple-600 text-white py-2 rounded hover:bg-purple-700">Analyze Sentiment</button>
</form>

{% if prediction %}
  <div class="mt-6 p-4 bg-gray-50 rounded-lg shadow">
    <h3 class="text-lg font-bold mb-2 text-indigo-700">Predicted Sentiment: 
      <span class="text-xl font-semibold text-green-600">{{ prediction }}</span></h3>

    <ul class="text-sm text-gray-700">
      {% for label, prob in probs %}
        <li>{{ label }}: {{ "%.2f" | format(prob * 100) }}%</li>
      {% endfor %}
    </ul>

    <form method="POST" class="mt-4 flex gap-4 justify-center">
      <button name="feedback" value="true" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">✅ Correct</button>
      <button name="feedback" value="false" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">❌ Incorrect</button>
    </form>
  </div>
{% endif %}
{% endblock %}
