{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-semibold mb-4">Register</h2>
<form method="POST">
  <input name="username" class="w-full p-2 mb-3 border rounded" placeholder="Username" required>
  <input name="password" type="password" class="w-full p-2 mb-3 border rounded" placeholder="Password" required>
  <button class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Register</button>
</form>
<p class="mt-4 text-sm text-gray-600">Already have an account? <a href="{{ url_for('login') }}" class="text-blue-600">Login</a></p>
{% endblock %}
