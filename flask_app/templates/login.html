{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-semibold mb-4">Login</h2>
<form method="POST">
  <input name="username" class="w-full p-2 mb-3 border rounded" placeholder="Username" required>
  <input name="password" type="password" class="w-full p-2 mb-3 border rounded" placeholder="Password" required>
  <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Login</button>
</form>
<p class="mt-4 text-sm text-gray-600">Don’t have an account? <a href="{{ url_for('register') }}" class="text-blue-600">Register</a></p>
{% endblock %}
